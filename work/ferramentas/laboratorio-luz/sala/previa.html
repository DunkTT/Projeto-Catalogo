<!doctype html>
<!-- Prévia local da sala usando o contrato e o núcleo de iluminação existente.
     SVG e JSON incorporados permitem abrir sem servidor; não carrega produtos. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de estar · Estudo visual</title>
  <style>
    :root {
      color-scheme: light; --pagina: #e8e8e2; --texto: #26322e; --secundario: #54615a;
      --claro: #f4f3ed; --escuro: #202927; --borda: #aeb4ac; --texto-escuro: #eceee5;
      --espaco: 16px; --espaco-amplo: 32px; --raio: 8px; --largura: 1400px;
      --pino: #315f74; --trilho: #d8e8e7; --borda-trilho: #759ba4;
      --duracao: 220ms; --alvo: 44px;
      --controle: #f4f3ed; --texto-cena-clara: #26322e;
    }
    html[data-tema="escuro"] {
      color-scheme: dark; --pagina: #171e1c; --texto: #eceee5; --secundario: #bbc5bd;
      --controle: #2b3531; --borda: #6e7e74; --pino: #e8c477;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: var(--espaco-amplo); background: var(--pagina); color: var(--texto); font-family: system-ui, sans-serif; }
    main { max-width: var(--largura); margin-inline: auto; }
    h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
    .cabecalho { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--espaco); }
    p { color: var(--secundario); line-height: 1.5; }
    .cenas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--espaco); }
    figure { min-width: 0; margin: 0; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--claro); color: var(--texto-cena-clara); }
    figure:last-child { background: var(--escuro); color: var(--texto-escuro); }
    img { display: block; width: 100%; height: auto; }
    .palco { display: block; width: 100%; aspect-ratio: 960 / 760; }
    fieldset { display: flex; flex-wrap: wrap; gap: var(--espaco); align-items: center; min-width: 0; margin: 0; padding: var(--espaco); border: 1px solid var(--borda); border-radius: var(--raio); }
    [hidden] { display: none !important; }
    .identidade-cena { display: flex; flex-wrap: wrap; gap: var(--espaco); }
    .identidade-cena div { display: grid; gap: calc(var(--espaco) / 4); }
    dt { font-size: .875rem; color: var(--secundario); }
    dd { margin: 0; }
    details { margin-block: var(--espaco); }
    summary { min-height: var(--alvo); cursor: pointer; padding-block: calc(var(--espaco) / 2); }
    label { display: flex; flex-wrap: wrap; align-items: center; gap: var(--espaco); }
    select, button, input { font: inherit; max-width: 100%; min-height: var(--alvo); }
    select, button { color: var(--texto); background: var(--controle); border: 1px solid var(--borda); border-radius: var(--raio); padding: 8px; }
    button[role="switch"] { display: inline-flex; align-items: center; gap: 8px; }
    .trilho-interruptor { display: inline-flex; align-items: center; width: 44px; height: 26px; padding: 3px; border: 1px solid var(--borda-trilho); border-radius: 99px; background: var(--trilho); }
    .pino-interruptor { width: 18px; height: 18px; border-radius: 50%; background: var(--pino); transform: translateX(0); transition: transform var(--duracao) cubic-bezier(.2,.7,.2,1); }
    [aria-checked="true"] .pino-interruptor { transform: translateX(18px); }
    :focus-visible { outline: 2px solid var(--pino); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { .pino-interruptor { transition: none; } }
    figcaption { padding: var(--espaco); font-size: .875rem; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (max-width: 750px) {
      body { padding: var(--espaco); }
      .cenas { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
  <link rel="stylesheet" href="../../../catalogo-web/css_style/interruptor-tema.css">
</head>
<body>
  <main>
    <header class="cabecalho">
      <h1>Sala de estar</h1>
      <button id="alternar-tema" class="interruptor-tema" type="button" role="switch" aria-label="Tema claro" aria-checked="false" disabled><span class="trilho-interruptor" aria-hidden="true"><span class="pino-interruptor"></span></span>Tema claro</button>
    </header>
    <dl class="identidade-cena">
      <div><dt>Ambiente</dt><dd>Sala de estar</dd></div>
      <div><dt>Cena</dt><dd>Industrial acolhedor · modelo único</dd></div>
    </dl>
    <p id="aviso-ilustrativo">Visualização ilustrativa.</p>
    <fieldset disabled aria-describedby="aviso-ilustrativo">
      <legend>Escolha a iluminação</legend>
      <label>Iluminação geral <select id="tom"></select></label>
      <button id="apoio" type="button" role="switch" aria-checked="false" aria-label="Luz de apoio" hidden><span aria-hidden="true" class="trilho-interruptor"><span class="pino-interruptor"></span></span>Luz de apoio <span id="estado-apoio" aria-hidden="true"></span></button>
    </fieldset>
    <p id="estado" role="status" aria-live="polite">Preparando sala…</p>
    <noscript><p>Ative JavaScript para usar os controles. A arte estática continua disponível.</p></noscript>
    <div class="cenas">
      <figure>
        <div class="palco"><img src="sala-estar.svg" width="960" height="760" alt="Sala em perspectiva, com sofá verde acinzentado, mesa de madeira, janela e duas luminárias, sobre fundo claro."></div>
        <figcaption>Superfície clara</figcaption>
      </figure>
      <figure>
        <div class="palco"><img src="sala-estar.svg" width="960" height="760" alt="A mesma sala e seus materiais sobre fundo escuro."></div>
        <figcaption>Superfície escura</figcaption>
      </figure>
    </div>
    <p>Representação ilustrativa. <a href="sala-estar.svg">Abrir arte em tamanho livre</a></p>
    <details>
      <summary>Ajustes do laboratório</summary>
      <fieldset disabled>
        <legend>Prévia local</legend>
        <label>Efeitos <select id="qualidade"><option value="padrao">Padrão</option><option value="economico">Econômico</option><option value="desligado">Desligado</option></select></label>
        <label>Carregar cena JSON <input id="arquivo-cena" type="file" accept=".json,application/json"></label>
      </fieldset>
    </details>
  </main>
